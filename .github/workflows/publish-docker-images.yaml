name: Publish Docker images

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Image tag to apply (e.g. v0.1.0)"
                required: true
                type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    publish-docker-images:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - image: codelit/frontlit-api
                      file: ./apps/api/Dockerfile
                    - image: codelit/frontlit-web
                      file: ./apps/web/Dockerfile
                    - image: codelit/frontlit-sites
                      file: ./apps/sites/Dockerfile
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: Setup QEMU
              uses: docker/setup-qemu-action@v3

            - name: Setup buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to DockerHub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERNAME }}
                  password: ${{ secrets.DOCKERTOKEN }}

            - name: Docker meta
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ matrix.image }}
                  tags: |
                      type=ref,event=tag
                      type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
                      type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v') }}

            - name: Build and push
              id: docker_build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.file }}
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.image }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image }}

            - name: Image digest
              run: echo ${{ steps.docker_build.outputs.digest }}
