name: Platform Conformance

on:
    pull_request:
    push:
        branches: [main]

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.1
            - run: bun install --frozen-lockfile
            - run: bun run check:drift
            - name: Build packages
              run: |
                  bun run --filter @frontlit/api-contract build
                  bun run --filter @frontlit/text-editor build
                  bun run --filter @frontlit/media-uploader build
                  bun run --filter @frontlit/page-builder build
            - run: bun run typecheck
            - run: bun --filter @frontlit/api test src/conformance.test.ts
