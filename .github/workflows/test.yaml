name: Testing
on:
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Build packages
              run: |
                  pnpm --filter @frontlit/api-contract build
                  pnpm --filter @frontlit/text-editor build
                  pnpm --filter @frontlit/page-builder build
            - name: Running tests
              run: |
                  pnpm test
              working-directory: ./
