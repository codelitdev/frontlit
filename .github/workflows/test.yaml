name: Testing
on:
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        # A normal run takes about 5 minutes; fail a hung one instead of
        # waiting for GitHub's 6-hour limit.
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.1
            - run: bun install --frozen-lockfile
            - name: Build packages
              run: |
                  bun run --filter @frontlit/api-contract build
                  bun run --filter @frontlit/text-editor build
                  bun run --filter @frontlit/media-uploader build
                  bun run --filter @frontlit/page-builder build
                  bun run --filter @frontlit/site-seo build
            - name: Embed loader size budget
              run: bun run --filter @frontlit/sites check:embed-size
            - name: Running tests
              run: |
                  bun run test
              working-directory: ./
